    <style>
        /* Custom CSS for Sliding Animation */
        .container-custom {
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 1000px;
            min-height: 600px;
        }

        .form-container {
            position: absolute;
            top: 0;
            height: 100%;
            transition: all 0.6s ease-in-out;
        }

        /* LTR Styles */
        html[dir="ltr"] .sign-in-container {
            left: 0;
            width: 50%;
            z-index: 2;
        }

        html[dir="ltr"] .sign-up-container {
            left: 0;
            width: 50%;
            opacity: 0;
            z-index: 1;
        }

        html[dir="ltr"] .container-custom.right-panel-active .sign-in-container {
            transform: translateX(100%);
        }

        html[dir="ltr"] .container-custom.right-panel-active .sign-up-container {
            transform: translateX(100%);
            opacity: 1;
            z-index: 5;
            animation: show 0.6s;
        }

        /* RTL Styles */
        html[dir="rtl"] .sign-in-container {
            right: 0;
            width: 50%;
            z-index: 2;
        }

        html[dir="rtl"] .sign-up-container {
            right: 0;
            width: 50%;
            opacity: 0;
            z-index: 1;
        }

        html[dir="rtl"] .container-custom.right-panel-active .sign-in-container {
            transform: translateX(-100%);
        }

        html[dir="rtl"] .container-custom.right-panel-active .sign-up-container {
            transform: translateX(-100%);
            opacity: 1;
            z-index: 5;
            animation: show 0.6s;
        }

        @keyframes show {

            0%,
            49.99% {
                opacity: 0;
                z-index: 1;
            }

            50%,
            100% {
                opacity: 1;
                z-index: 5;
            }
        }

        .overlay-container {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: transform 0.6s ease-in-out;
            z-index: 100;
        }

        /* LTR Overlay */
        html[dir="ltr"] .overlay-container {
            left: 50%;
        }

        html[dir="ltr"] .container-custom.right-panel-active .overlay-container {
            transform: translateX(-100%);
        }

        /* RTL Overlay */
        html[dir="rtl"] .overlay-container {
            right: 50%;
        }

        html[dir="rtl"] .container-custom.right-panel-active .overlay-container {
            transform: translateX(100%);
        }

        .overlay {
            background: linear-gradient(to right, #4f46e5, #c026d3);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 0 0;
            color: #FFFFFF;
            position: relative;
            height: 100%;
            width: 200%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
        }

        /* LTR Overlay Inner */
        html[dir="ltr"] .overlay {
            left: -100%;
        }

        html[dir="ltr"] .container-custom.right-panel-active .overlay {
            transform: translateX(50%);
        }

        /* RTL Overlay Inner */
        html[dir="rtl"] .overlay {
            right: -100%;
        }

        html[dir="rtl"] .container-custom.right-panel-active .overlay {
            transform: translateX(-50%);
        }

        .overlay-panel {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 40px;
            text-align: center;
            top: 0;
            height: 100%;
            width: 50%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
        }

        /* LTR Panels */
        html[dir="ltr"] .overlay-left {
            transform: translateX(-20%);
        }

        html[dir="ltr"] .container-custom.right-panel-active .overlay-left {
            transform: translateX(0);
        }

        html[dir="ltr"] .overlay-right {
            right: 0;
            transform: translateX(0);
        }

        html[dir="ltr"] .container-custom.right-panel-active .overlay-right {
            transform: translateX(20%);
        }

        /* RTL Panels */
        html[dir="rtl"] .overlay-left {
            transform: translateX(20%);
        }

        html[dir="rtl"] .container-custom.right-panel-active .overlay-left {
            transform: translateX(0);
        }

        html[dir="rtl"] .overlay-right {
            left: 0;
            transform: translateX(0);
        }

        html[dir="rtl"] .container-custom.right-panel-active .overlay-right {
            transform: translateX(-20%);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .container-custom {
                min-height: auto;
                height: auto;
                max-width: 100%;
                box-shadow: none;
                background: transparent;
            }

            .form-container {
                position: relative;
                width: 100% !important;
                height: auto;
                transition: none;
                opacity: 0;
                display: none;
                background: white;
                border-radius: 24px;
                padding: 40px 20px;
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            }

            .dark .form-container {
                background: #111827;
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            }

            /* Default State (Sign In Visible) */
            .sign-in-container {
                opacity: 1;
                display: flex;
                z-index: 10;
            }

            .sign-up-container {
                opacity: 0;
                display: none;
                z-index: 1;
            }

            /* Active State (Sign Up Visible) */
            .container-custom.right-panel-active .sign-in-container {
                transform: none !important;
                opacity: 0;
                display: none;
            }

            .container-custom.right-panel-active .sign-up-container {
                transform: none !important;
                opacity: 1;
                display: flex;
                animation: fadeIn 0.5s;
            }

            @keyframes fadeIn {
                0% {
                    opacity: 0;
                    transform: translateY(20px);
                }

                100% {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .overlay-container {
                display: none;
            }

            /* Mobile Toggle Buttons */
            .mobile-toggle {
                display: flex;
                justify-content: center;
                margin-bottom: 20px;
                background: rgba(255, 255, 255, 0.5);
                backdrop-filter: blur(10px);
                padding: 5px;
                border-radius: 12px;
                border: 1px solid rgba(229, 231, 235, 0.5);
            }

            .dark .mobile-toggle {
                background: rgba(17, 24, 39, 0.5);
                border-color: rgba(55, 65, 81, 0.5);
            }

            .mobile-toggle-btn {
                padding: 10px 24px;
                border-radius: 8px;
                font-weight: 600;
                font-size: 14px;
                transition: all 0.3s ease;
                color: #6B7280;
                width: 50%;
                text-align: center;
            }

            .dark .mobile-toggle-btn {
                color: #9CA3AF;
            }

            .mobile-toggle-btn.active {
                background: #4f46e5;
                color: white;
                box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.3);
            }
        }
    </style>
</head>

        <script>
            const signUpButton = document.getElementById('signUp');
            const signInButton = document.getElementById('signIn');
            const mobileSignUpBtn = document.getElementById('mobile-signup-btn');
            const mobileSignInBtn = document.getElementById('mobile-signin-btn');
            const container = document.getElementById('container');

            // Function to switch to Sign Up
            function switchToSignUp() {
                container.classList.add("right-panel-active");
                if (window.innerWidth <= 768) {
                    mobileSignInBtn.classList.remove('active', 'bg-primary-600', 'text-white', 'shadow-lg');
                    mobileSignUpBtn.classList.add('active', 'bg-primary-600', 'text-white', 'shadow-lg');
                }
            }

            // Function to switch to Sign In
            function switchToSignIn() {
                container.classList.remove("right-panel-active");
                if (window.innerWidth <= 768) {
                    mobileSignUpBtn.classList.remove('active', 'bg-primary-600', 'text-white', 'shadow-lg');
                    mobileSignInBtn.classList.add('active', 'bg-primary-600', 'text-white', 'shadow-lg');
                }
            }

            signUpButton.addEventListener('click', switchToSignUp);
            signInButton.addEventListener('click', switchToSignIn);

            // Mobile listeners
            if (mobileSignUpBtn) mobileSignUpBtn.addEventListener('click', switchToSignUp);
            if (mobileSignInBtn) mobileSignInBtn.addEventListener('click', switchToSignIn);

            // Initial mobile button state
            if (window.innerWidth <= 768) {
                mobileSignInBtn.classList.add('bg-primary-600', 'text-white', 'shadow-lg'); // Default active style
            }

            // Theme Toggle
            const themeToggle = document.getElementById('theme-toggle');
            const html = document.documentElement;

            // Check local storage
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                html.classList.add('dark');
            } else {
                html.classList.remove('dark');
            }

            themeToggle.addEventListener('click', () => {
                html.classList.toggle('dark');
                if (html.classList.contains('dark')) {
                    localStorage.theme = 'dark';
                } else {
                    localStorage.theme = 'light';
                }
            });

            // Direction Toggle
            const directionToggle = document.getElementById('direction-toggle');

            // Check local storage
            if (localStorage.dir === 'rtl') {
                html.setAttribute('dir', 'rtl');
            } else {
                html.setAttribute('dir', 'ltr');
            }

            directionToggle.addEventListener('click', () => {
                const currentDir = html.getAttribute('dir');
                const newDir = currentDir === 'ltr' ? 'rtl' : 'ltr';
                html.setAttribute('dir', newDir);
                localStorage.dir = newDir;
            });

            // Check URL for mode
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('mode') === 'register') {
                container.classList.add("right-panel-active");
            }
        </script>

    </div>

</body>

</html>
