<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Urcourse</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['"Outfit"', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                            950: '#1e1b4b',
                        },
                        dark: {
                            bg: '#0B0F19',
                            card: '#111827',
                            border: '#1F2937'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col relative overflow-hidden">

    <!-- Background -->
    <div class="absolute inset-0">
        <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80"
            alt="Background" class="w-full h-full object-cover opacity-20">
        <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/80 to-transparent"></div>
    </div>

    <!-- Content -->
    <div class="relative z-10 container mx-auto px-4 flex-1 flex flex-col items-center justify-center text-center">
        <div class="mb-8">
            <div
                class="w-16 h-16 mx-auto bg-gradient-to-br from-primary-600 to-purple-600 rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-primary-500/30">
                <span class="font-heading font-bold text-3xl">U</span>
            </div>
            <h1 class="font-heading font-bold text-4xl md:text-6xl mb-4">We're Launching Soon</h1>
            <p class="text-xl text-gray-300 max-w-2xl mx-auto">We're building something amazing for you. Stay tuned for
                the ultimate learning experience.</p>
        </div>

        <!-- Countdown -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-8 mb-12">
            <div class="bg-white/10 backdrop-blur-md border border-white/10 rounded-2xl p-4 md:p-6 min-w-[100px]">
                <div class="font-heading font-bold text-3xl md:text-4xl mb-1" id="days">00</div>
                <div class="text-xs md:text-sm text-gray-400 uppercase tracking-wider">Days</div>
            </div>
            <div class="bg-white/10 backdrop-blur-md border border-white/10 rounded-2xl p-4 md:p-6 min-w-[100px]">
                <div class="font-heading font-bold text-3xl md:text-4xl mb-1" id="hours">00</div>
                <div class="text-xs md:text-sm text-gray-400 uppercase tracking-wider">Hours</div>
            </div>
            <div class="bg-white/10 backdrop-blur-md border border-white/10 rounded-2xl p-4 md:p-6 min-w-[100px]">
                <div class="font-heading font-bold text-3xl md:text-4xl mb-1" id="minutes">00</div>
                <div class="text-xs md:text-sm text-gray-400 uppercase tracking-wider">Minutes</div>
            </div>
            <div class="bg-white/10 backdrop-blur-md border border-white/10 rounded-2xl p-4 md:p-6 min-w-[100px]">
                <div class="font-heading font-bold text-3xl md:text-4xl mb-1" id="seconds">00</div>
                <div class="text-xs md:text-sm text-gray-400 uppercase tracking-wider">Seconds</div>
            </div>
        </div>

        <!-- Newsletter -->
        <div class="w-full max-w-md">
            <form class="flex flex-col gap-3">
                <input type="email" placeholder="Enter your email address"
                    class="w-full px-6 py-4 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:border-primary-500 transition-colors text-center md:text-left">
                <button type="submit"
                    class="w-full px-6 py-4 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-bold transition-all hover:scale-105 shadow-lg shadow-primary-500/30">Notify
                    Me</button>
            </form>
            <p class="mt-4 text-sm text-gray-500">We promise not to spam you.</p>
        </div>
    </div>

    <!-- Footer -->
    <div class="relative z-10 py-8 text-center text-gray-500 text-sm">
        <p>&copy; 2025 Urcourse. All rights reserved.</p>
    </div>

    <script>
        // Set the date we're counting down to
        const countDownDate = new Date().getTime() + (14 * 24 * 60 * 60 * 1000); // 14 days from now

        // Update the count down every 1 second
        const x = setInterval(function () {
            const now = new Date().getTime();
            const distance = countDownDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerHTML = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerHTML = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerHTML = seconds < 10 ? "0" + seconds : seconds;

            if (distance < 0) {
                clearInterval(x);
                document.getElementById("days").innerHTML = "00";
                document.getElementById("hours").innerHTML = "00";
                document.getElementById("minutes").innerHTML = "00";
                document.getElementById("seconds").innerHTML = "00";
            }
        }, 1000);
    </script>
</body>

</html>
